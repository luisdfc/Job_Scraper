name: Local scraper checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository privacy
        run: python scripts/check_privacy.py
      - name: Install test dependencies
        run: pip install -r tests/requirements-dev.txt
      - name: Test offline
        run: python -m pytest --ignore=tests/local -q
